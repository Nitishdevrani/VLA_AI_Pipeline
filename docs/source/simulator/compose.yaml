version: '3.8'

services:
  frasky_test:
    image: frasky_test:latest
    container_name: frasky_test
    init: true
    ipc: host
    network_mode: host
    privileged: true
    stdin_open: true  # -i flag
    tty: true         # -t flag

    # Hardware devices mapping
    devices:
      - /dev/dri:/dev/dri
      - /dev/input:/dev/input

    # Mounting host devices and X11 display socket
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./test_mapping.json:/home/frasky_ws_container/catkin_ws/src/frasky_ws/frasky_detection/crop_map_db/test_mapping.json
      - ./mapping_first_row.json:/home/frasky_ws_container/catkin_ws/src/frasky_ws/frasky_detection/crop_map_db/mapping_first_row.json

      - ./my_pkgs:/home/frasky_ws_container/catkin_ws/src/my_pkgs
      - ./husky_nav_out.json/:/home/frasky_ws_container/catkin_ws/src/frasky_ws/autonomous_task/robots/frasky/tasks/husky_nav_out.json
    # Host environment variables
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - QT_X11_NO_MITSHM=1

      

    # GPU acceleration configuration (--gpus all)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command: bash